name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flightwall-web:ci .
      - name: Smoke test
        run: |
          docker run -d --name fw -p 8080:8080 flightwall-web:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 2; done
          curl -fs localhost:8080/healthz || { docker logs fw; exit 1; }
          # Every script/stylesheet referenced by the page must be served (catches missing Blazor runtime).
          for u in $(curl -fs localhost:8080/settings | grep -oE '(src|href)="[^"]+\.(js|css)"' | cut -d'"' -f2 | grep -v '^https'); do
            curl -fs -o /dev/null "localhost:8080/$u" || { echo "MISSING $u"; exit 1; }
          done
