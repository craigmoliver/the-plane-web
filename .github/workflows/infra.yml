name: Azure infrastructure

# Manual start/stop of the Azure stack, to stop paying for it when it isn't in use.
# Dispatch from the main branch (the production environment's branch policy also enforces this).
#
#   setup     Provision the stack if it's missing (runs the full deploy pipeline), otherwise start
#             a deallocated VM. Idempotent: a running VM is just re-smoke-tested.
#   teardown  Deallocate the VM. Cheapest reversible stop: compute billing ends, but the OS disk,
#             static public IP and backup vault remain (~$12-15/month). Data, DNS name and Caddy
#             certificates are preserved, so a later `setup` brings it back in seconds.
#   delete    Delete the whole resource group: VM, disk, public IP, network and backup vault, so all
#             charges stop. Irreversible -- local accounts/settings and backup history are lost. The
#             public IP's DNS label is derived from the resource group id, so `setup` recreates the
#             same hostname with a fresh bootstrap admin. Requires the `confirm` input below.
#
# Reuses the deploy pipeline (deploy.yml) for the rebuild path rather than duplicating it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the Azure infrastructure
        type: choice
        required: true
        default: setup
        options:
          - setup
          - teardown
          - delete
      confirm:
        description: "For delete: type the resource group name to confirm"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write   # OIDC sign-in to Azure (no stored Azure credentials)

# Never race a push-to-main deploy: both touch the same Azure resources.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  setup-detect:
    # Skip until Azure is configured (docs/azure.md), so the workflow is inert otherwise.
    if: vars.AZURE_CLIENT_ID != '' && inputs.action == 'setup'
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      vm_exists: ${{ steps.detect.outputs.vm_exists }}
      vm_running: ${{ steps.detect.outputs.vm_running }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: detect
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          VM=planeweb-vm
          if az vm show -g "$RG" -n "$VM" -o none 2>/dev/null; then
            state=$(az vm get-instance-view -g "$RG" -n "$VM" \
              --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)
            echo "VM exists; power state: $state"
            echo "vm_exists=true" >> "$GITHUB_OUTPUT"
            if [ "$state" = "PowerState/running" ]; then
              echo "vm_running=true" >> "$GITHUB_OUTPUT"
            else
              echo "vm_running=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No VM in '$RG'; a full deploy is needed."
            echo "vm_exists=false" >> "$GITHUB_OUTPUT"
            echo "vm_running=false" >> "$GITHUB_OUTPUT"
          fi

  setup-start:
    needs: setup-detect
    if: needs.setup-detect.outputs.vm_exists == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Start the VM
        # Containers use `restart: unless-stopped`, so docker brings them back with the VM.
        if: needs.setup-detect.outputs.vm_running != 'true'
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          VM=planeweb-vm
          echo "Starting $VM..."
          az vm start -g "$RG" -n "$VM" -o none
          for i in $(seq 1 60); do
            state=$(az vm get-instance-view -g "$RG" -n "$VM" \
              --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)
            if [ "$state" = "PowerState/running" ]; then echo "VM running."; exit 0; fi
            sleep 5
          done
          echo "VM did not reach running state in time." >&2
          exit 1
      - name: Smoke test
        # The public IP is static and keeps its Azure DNS name while deallocated.
        run: |
          url="https://$(az network public-ip show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n planeweb-ip \
            --query dnsSettings.fqdn -o tsv)"
          echo "Waiting for $url ..."
          for i in $(seq 1 60); do curl -fs "$url/healthz" && break; sleep 10; done
          curl -fs "$url/healthz"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/settings")" = 302
          echo "Running: $url"

  setup-redeploy:
    # Infra is gone (or never created): run the normal test -> image -> Bicep -> Run Command pipeline.
    needs: setup-detect
    if: needs.setup-detect.outputs.vm_exists != 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  teardown:
    if: vars.AZURE_CLIENT_ID != '' && inputs.action == 'teardown'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deallocate the VM
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          VM=planeweb-vm
          if ! az vm show -g "$RG" -n "$VM" -o none 2>/dev/null; then
            echo "No VM '$VM' in '$RG' -- nothing to deallocate."
            exit 0
          fi
          state=$(az vm get-instance-view -g "$RG" -n "$VM" \
            --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)
          if [ "$state" = "PowerState/deallocated" ]; then
            echo "VM already deallocated."
            exit 0
          fi
          echo "Deallocating $VM (current state: $state)..."
          az vm deallocate -g "$RG" -n "$VM" -o none
          echo "VM deallocated. Compute charges stopped; OS disk, public IP and backup remain."

  delete:
    if: vars.AZURE_CLIENT_ID != '' && inputs.action == 'delete'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete the resource group
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          if [ "$CONFIRM" != "$RG" ]; then
            echo "Refusing to delete: set the 'confirm' input to exactly '$RG' to proceed." >&2
            exit 1
          fi
          if ! az group exists -n "$RG" | grep -q true; then
            echo "Resource group '$RG' does not exist -- nothing to delete."
            exit 0
          fi
          echo "Deleting resource group '$RG' (VM, disk, IP, network, backup vault and all data)..."
          az group delete -n "$RG" --yes --no-wait
          for i in $(seq 1 180); do
            if ! az group exists -n "$RG" 2>/dev/null | grep -q true; then
              echo "Deleted after ~$((i * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for deletion; it may still be completing in Azure." >&2
          exit 1
