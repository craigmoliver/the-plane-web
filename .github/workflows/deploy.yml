name: Deploy to Azure

# Builds the image, pushes it to GitHub Container Registry, deploys infra/main.bicep (a small VM),
# then uses Azure Run Command to pull the image and start it with Docker Compose + Caddy for HTTPS.
# Run Command works over the Azure control plane via the VM agent; no SSH port is ever open.
# One-time setup: docs/azure.md (OIDC federated credential, repo variables and secrets).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # OIDC sign-in to Azure (no stored Azure credentials)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    # Skip until Azure is configured (docs/azure.md), so pushes to main don't fail.
    # Only main deploys (manual runs from other branches are refused).
    if: vars.AZURE_CLIENT_ID != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # defense in depth with the environment's branch policy
    runs-on: ubuntu-latest
    environment:
      name: production   # add required reviewers here to gate deploys
      url: ${{ steps.infra.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure resource providers
        # Required once per subscription; can be run multiple times safely.
        # Using --wait ensures provider is fully registered before proceeding.
        # This step may fail if the deployment identity lacks subscription-level permissions;
        # that's OK — providers should already be registered by Azure admin during initial setup.
        # If providers aren't registered, the Bicep deployment will fail with a clear error.
        continue-on-error: true
        run: |
          for provider in Microsoft.Compute Microsoft.Network Microsoft.RecoveryServices; do
            az provider register -n $provider --accept-terms --wait 2>&1 | grep -v "^WARNING:" || true
          done

      - name: Prepare resource group
        # If upgrading from Container Apps + PostgreSQL design (which used incompatible VNet/subnet layout),
        # delete the old group to avoid conflict errors (InUseSubnetCannotBeDeleted, etc.).
        # On first deploy, the group doesn't exist yet; az group delete is idempotent.
        # Deletion is async; we poll for completion with a 4-minute timeout (120 retries × 2s).
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          # Check if group exists with old resources (Container Apps vnet + Legion Legion subnet)
          if az group exists -n "$RG" | grep -q true; then
            if az network vnet list -g "$RG" --query "[?contains(name, 'planeweb')].{name:name, subnets:subnets[].name}" -o json 2>/dev/null | grep -q '"apps"'; then
              echo "Old Container Apps infrastructure detected; deleting resource group to avoid subnet conflicts..."
              az group delete -n "$RG" --yes --no-wait
              echo "Resource group deletion started (async). Waiting for completion..."
              for i in {1..60}; do
                if ! az group exists -n "$RG" 2>/dev/null | grep -q true; then
                  echo "Resource group deleted successfully after $((i * 2)) seconds"
                  break
                fi
                sleep 2
              done
            fi
          fi
          # Ensure group exists for new VM deployment
          az group create -n "$RG" -l eastus2 --tags "app=planeweb" -o none

      - name: Determine the VM's SSH key
        # Azure rejects changing a VM's SSH key after creation (PropertyChangeNotAllowed), so redeploys
        # must reuse the existing one; only the first deploy generates a fresh ephemeral key. Either way
        # it is never saved and, because no NSG rule opens port 22 (see infra/main.bicep), it is never
        # actually usable for SSH -- it exists purely to satisfy the Linux VM creation API.
        run: |
          existing=$(az vm show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n planeweb-vm \
            --query "osProfile.linuxConfiguration.ssh.publicKeys[0].keyData" -o tsv 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "None" ]; then
            echo "SSH_PUBLIC_KEY=$existing" >> "$GITHUB_ENV"
          else
            ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/deploy_key" -q -C 'unused-vm-creation-only'
            echo "SSH_PUBLIC_KEY=$(cat "$RUNNER_TEMP/deploy_key.pub")" >> "$GITHUB_ENV"
            rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_key.pub"
          fi

      - name: Write parameters file
        # Values go through JSON (not a command line) so secrets with spaces/quotes survive verbatim.
        env:
          ADMIN_SSH_PUBLIC_KEY: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          umask 077
          jq -n '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            contentVersion: "1.0.0.0",
            parameters: { adminSshPublicKey: { value: env.ADMIN_SSH_PUBLIC_KEY } }
          }' > "$RUNNER_TEMP/params.json"

      - id: infra
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          deploymentName: planeweb-${{ github.run_number }}
          failOnStdErr: false
          parameters: ${{ runner.temp }}/params.json

      - name: Build the remote setup script
        # Compose file and the app's own configuration are base64-embedded so no secret value can
        # break shell quoting or be misparsed as code. Only this execution's stdout/stderr is returned
        # by Run Command; the script body itself is not persisted as a resource (ad-hoc invoke).
        env:
          PLANEWEB_IMAGE: ${{ needs.build.outputs.image }}
          PLANEWEB_HOST: ${{ steps.infra.outputs.host }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LOCAL_LOGIN: ${{ vars.LOCAL_LOGIN }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          ENTRA_ADMIN_OBJECT_IDS: ${{ vars.ENTRA_ADMIN_OBJECT_IDS }}
        run: |
          set -euo pipefail
          umask 077
          # The app's own configuration (passwords, client secrets, ...): written byte-for-byte on the
          # VM and loaded by Compose with format: raw (see docker-compose.prod.yml and the template),
          # so values may safely contain $, `, " etc. Must never go through Compose's own project .env,
          # which is always variable-expanded -- see docker-compose.prod.yml's header comment.
          SECRETS_FILE="$RUNNER_TEMP/planeweb.secrets.env"
          {
            echo "PlaneWeb__Auth__AdminEmail=$ADMIN_EMAIL"
            echo "PlaneWeb__Auth__AdminPassword=$ADMIN_PASSWORD"
            echo "PlaneWeb__Auth__LocalLogin=${LOCAL_LOGIN:-true}"
            echo "PlaneWeb__Auth__Entra__TenantId=$ENTRA_TENANT_ID"
            echo "PlaneWeb__Auth__Entra__ClientId=$ENTRA_CLIENT_ID"
            echo "PlaneWeb__Auth__Entra__ClientSecret=$ENTRA_CLIENT_SECRET"
            i=0
            IFS=',' read -ra IDS <<< "$ENTRA_ADMIN_OBJECT_IDS"
            for raw in "${IDS[@]}"; do
              id=$(echo "$raw" | xargs)
              if [ -n "$id" ]; then echo "PlaneWeb__Auth__Entra__AdminObjectIds__$i=$id"; i=$((i + 1)); fi
            done
          } > "$SECRETS_FILE"

          SECRETS_B64=$(base64 -w0 < "$SECRETS_FILE")
          COMPOSE_B64=$(base64 -w0 < docker-compose.prod.yml)
          CADDY_B64=$(base64 -w0 < Caddyfile)
          GHCR_TOKEN_B64=$(printf '%s' "$GHCR_TOKEN" | base64 -w0)
          rm -f "$SECRETS_FILE"

          SCRIPT="$RUNNER_TEMP/remote-script.sh"
          cp infra/remote-setup.sh.template "$SCRIPT"
          # PLANEWEB_IMAGE/PLANEWEB_HOST are not secrets (an image tag, an Azure DNS name) and are
          # guaranteed free of quotes/backticks, so a direct substitution is safe. The rest are base64.
          sed -i \
            -e "s|__COMPOSE_B64__|$COMPOSE_B64|" \
            -e "s|__CADDY_B64__|$CADDY_B64|" \
            -e "s|__SECRETS_B64__|$SECRETS_B64|" \
            -e "s|__PLANEWEB_IMAGE__|$PLANEWEB_IMAGE|" \
            -e "s|__PLANEWEB_HOST__|$PLANEWEB_HOST|" \
            -e "s|__GHCR_USERNAME__|$GHCR_USERNAME|" \
            -e "s|__GHCR_TOKEN_B64__|$GHCR_TOKEN_B64|" \
            "$SCRIPT"

      - name: Run setup on the VM (Azure Run Command; no SSH involved)
        run: |
          out=$(az vm run-command invoke -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.infra.outputs.vmName }}" \
            --command-id RunShellScript --scripts "@$RUNNER_TEMP/remote-script.sh" \
            --query "value[0].message" -o tsv)
          echo "$out"
          rm -f "$RUNNER_TEMP/remote-script.sh"
          echo "$out" | grep -q PLANEWEB_DEPLOY_OK

      - name: Smoke test
        run: |
          url="${{ steps.infra.outputs.url }}"
          for i in $(seq 1 40); do curl -fs "$url/healthz" && break; sleep 10; done
          curl -fs "$url/healthz"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/settings")" = 302
          echo "Deployed: $url  (Entra redirect URI: ${{ steps.infra.outputs.entraRedirectUri }})"
